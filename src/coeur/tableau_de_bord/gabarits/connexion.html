{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<section class="carte connexion">
  <h1>Connexion</h1>
  <p>Utilisez votre compte Directus. L'accès est réservé aux rôles autorisés (Validateur BCR, Tableau de bord).</p>
  {% if erreur %}<p class="erreur" role="alert">{{ erreur }}</p>{% endif %}
  <form method="post" action="/tableau-de-bord/connexion">
    <label for="email">Adresse électronique</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" name="mdp" type="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>
</section>
{% endblock %}
