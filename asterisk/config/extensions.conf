; Parcours d'un appel au numéro vert — modèle rendu au démarrage par synchro/configurer.py.
;
;   accueil (annonce de l'enregistrement) → choix de la langue → menu du SVI
;     ├─ réponse écoutée (contenu validé BCR) → retour au menu
;     └─ 0 : conseiller → file d'attente → agent (conversation enregistrée)
;                           └─ attente trop longue ou aucun agent → proposition de rappel
;
; Chaque étape est signalée au cœur (Gosub evenement) : c'est lui qui compte les
; appels, ne garde que l'empreinte du numéro et chiffre les numéros à rappeler.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
API={{API_URL}}
CLE_API={{CLE_API}}
RAPPEL_APRES={{RAPPEL_APRES_SECONDES}}
ENREGISTREMENTS=/var/spool/asterisk/enregistrements

; Menu du SVI, régénéré à partir des contenus publiés (synchro/synchroniser_svi.py).
#include extensions_svi.conf
; Appels simulés pour les tests (TELEPHONIE_SIMULATION=true).
#include extensions_simulation.conf

; ---------- Entrées ----------

[entree-operateur]
exten => _[+0-9].,1,Goto(accueil,s,1)
exten => s,1,Goto(accueil,s,1)

[simulateur]
exten => _[+0-9a-z*#].,1,Goto(accueil,s,1)

[accueil]
exten => s,1,Answer()
 same => n,Set(CHANNEL(language)=fr)
 same => n,Set(__LANGUE=fr)
 same => n,Set(__APPEL=${CHANNEL(linkedid)})
 same => n,Set(CHANNEL(hangup_handler_push)=fin-appel,s,1)
 same => n,Gosub(evenement,s,1(type=debut&numero=${URIENCODE(${CALLERID(num)})}))
 same => n,Wait(1)
 same => n,Playback(rgph/accueil)
 same => n,Goto(svi-langue,s,1)

[fin-appel]
exten => s,1,Gosub(evenement,s,1(type=fin))
 same => n,Return()

; Gosub(evenement,s,1(<champs>)) : POST /v1/appels/evenements avec la clé du canal centre_ecoute.
[evenement]
exten => s,1,Set(CURLOPT(httpheader)=X-Cle-API: ${CLE_API})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(REPONSE_API=${CURL(${API}/v1/appels/evenements,appel=${URIENCODE(${APPEL})}&${ARG1})})
 same => n,Return()

; ---------- File d'attente ----------

[file-attente]
exten => s,1,Gosub(evenement,s,1(type=file_entree&langue=${LANGUE}))
 same => n,Queue(rgph,,,,${RAPPEL_APRES},,,enregistrement)
 ; Attente trop longue : proposer un rappel.
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?proposer-rappel,s,1)
 ; Aucun agent connecté (ou tous en pause) : le dire, puis proposer un rappel.
 same => n,GotoIf($[${REGEX("EMPTY|UNAVAIL" ${QUEUESTATUS})}]?vide)
 ; Conversation terminée par l'agent.
 same => n,Hangup()
 same => n(vide),Playback(rgph/hors_service)
 same => n,Goto(proposer-rappel,s,1)

; Exécuté sur le canal de l'agent quand il décroche : enregistre la conversation.
[enregistrement]
exten => s,1,Set(FICHIER=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${FILTER(0-9A-Za-z.-,${APPEL})}.wav)
 same => n,Set(POSTE=simule)
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?enregistrer)
 same => n,Set(POSTE=${CHANNEL(endpoint)})
 same => n(enregistrer),MixMonitor(${ENREGISTREMENTS}/${FICHIER},b)
 same => n,Gosub(evenement,s,1(type=decroche&poste=${POSTE}&fichier=${FICHIER}))
 same => n,Return()

; ---------- Rappel ----------

[proposer-rappel]
exten => s,1,Set(ESSAIS=0)
 same => n(choix),Read(CHOIX,rgph/rappel_propose,1,,1,6)
 same => n,GotoIf($["${CHOIX}" = "1"]?rappel)
 same => n,GotoIf($["${CHOIX}" = "2"]?file-attente,s,1)
 same => n,Set(ESSAIS=$[${ESSAIS} + 1])
 same => n,GotoIf($[${ESSAIS} < 2]?choix)
 same => n,Playback(rgph/au_revoir)
 same => n,Hangup()
 same => n(rappel),GotoIf($[${REGEX("^[+]?[0-9]{9,15}$" ${CALLERID(num)})}]?possible)
 same => n,Playback(rgph/rappel_impossible)
 same => n,Goto(file-attente,s,1)
 same => n(possible),Gosub(evenement,s,1(type=rappel&numero=${URIENCODE(${CALLERID(num)})}&langue=${LANGUE}))
 same => n,Playback(rgph/rappel_confirme)
 same => n,Hangup()

; ---------- Postes des agents ----------

[postes]
; Boutons « pause » et « reprendre » de la console : l'agent ne reçoit plus / de nouveau les appels.
exten => *1,1,Answer()
 same => n,PauseQueueMember(rgph,PJSIP/${CHANNEL(endpoint)})
 same => n,Wait(1)
 same => n,Hangup()
exten => *2,1,Answer()
 same => n,UnpauseQueueMember(rgph,PJSIP/${CHANNEL(endpoint)})
 same => n,Wait(1)
 same => n,Hangup()

; Rappels des citoyens (bouton « Appeler » de la console).
exten => _0X.,1,{{APPEL_SORTANT}}
exten => _243X.,1,{{APPEL_SORTANT}}
exten => _+243X.,1,{{APPEL_SORTANT}}
