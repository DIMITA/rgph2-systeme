; Comptes et liaisons SIP — modèle rendu au démarrage par synchro/configurer.py.

[global]
type=global
user_agent=RGPH2-Centre-Appels
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
{{ADRESSE_EXTERNE}}

; Postes des agents dans le navigateur (WebRTC, via le serveur HTTP d'Asterisk).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- Postes des agents (poste1…posteN) ----------
{{POSTES}}

; ---------- Simulateur ----------
{{SIMULATEUR}}

; ---------- Opérateur ----------
{{OPERATEUR}}
