; File d'attente des conseillers — modèle rendu au démarrage par synchro/configurer.py.

[general]
persistentmembers=no
autofill=yes
shared_lastcall=yes

[rgph]
strategy=rrmemory
; Sonnerie de 20 s par agent, puis on essaie le suivant.
timeout=20
retry=3
; Pause de 10 s après chaque appel pour noter la fiche.
wrapuptime=10
ringinuse=no
; Personne n'entre en file si aucun agent n'est connecté ou disponible : on propose
; directement un rappel au lieu de faire attendre pour rien.
joinempty=paused,unavailable,invalid
leavewhenempty=unavailable,invalid
announce-frequency=0
announce-position=no
announce-holdtime=no
periodic-announce=rgph/attente
periodic-announce-frequency=45
musicclass=default
setinterfacevar=yes
{{MEMBRES}}
