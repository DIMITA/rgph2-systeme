; Appels simulés pour les tests automatiques (outils/verifier_telephonie.py).
; Présent seulement si TELEPHONIE_SIMULATION=true. Principe : un canal « Local »
; joue le citoyen (robot qui tape des touches), l'autre moitié suit le vrai parcours.
;
;   channel originate Local/<numero>@test-entree extension s@test-robot-faq

[test-entree]
exten => _X.,1,Set(CALLERID(num)=${EXTEN})
 same => n,Goto(accueil,s,1)

; Choisit le français (1) puis la première réponse du menu (1).
[test-robot-faq]
exten => s,1,Wait(22)
 same => n,SendDTMF(1)
 same => n,Wait(8)
 same => n,SendDTMF(1)
 same => n,Wait(40)
 same => n,Hangup()

; Choisit le français, demande un conseiller (0), puis accepte le rappel (1)
; dès qu'il est proposé (les appuis pendant les annonces sont ignorés).
[test-robot-conseiller]
exten => s,1,Wait(22)
 same => n,SendDTMF(1)
 same => n,Wait(8)
 same => n,SendDTMF(0)
 same => n,Set(N=0)
 same => n(boucle),Wait(3)
 same => n,SendDTMF(1)
 same => n,Set(N=$[${N} + 1])
 same => n,GotoIf($[${N} < 15]?boucle)
 same => n,Hangup()

; Agent simulé (ajouté à la file par le script de test) : décroche et « parle »
; (lit un message), pour que la conversation enregistrée contienne du son.
[test-agent]
exten => s,1,Answer()
 same => n,Playback(rgph/svi_intro)
 same => n,Hangup()
