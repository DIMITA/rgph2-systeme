[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# L'URL vient de la variable d'environnement DATABASE_URL (voir migrations/env.py) :
# les migrations doivent tourner avec le rôle propriétaire (rgph_admin).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
