[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgph2-coeur"
version = "0.1.0"
description = "Cœur du système d'information citoyenne du RGPH-2 (RDC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1,<3",
    "tzdata>=2024.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Vérification de la console des agents dans un vrai navigateur (outils/verifier_console_agent.py).
e2e = ["playwright>=1.48"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coeur = [
    "portail/gabarits/*.html", "portail/statique/*", "portail/textes/*.json",
    "tableau_de_bord/gabarits/*.html", "tableau_de_bord/statique/*",
    "mobile/textes/*.json", "simulateur/gabarits/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
