# Liaison SMPP de l'opérateur (Vodacom, Airtel, Orange), valeurs fournies par l'opérateur.
group = smsc
smsc = smpp
smsc-id = operateur
host = {{OPERATEUR_SMPP_HOTE}}
port = {{OPERATEUR_SMPP_PORT}}
transceiver-mode = true
smsc-username = "{{OPERATEUR_SMPP_UTILISATEUR}}"
smsc-password = "{{OPERATEUR_SMPP_MDP}}"
system-type = "{{OPERATEUR_SMPP_SYSTEM_TYPE}}"
# Numéro court ou nom d'expéditeur reconnu automatiquement ; destinataires internationaux.
source-addr-autodetect = yes
dest-addr-ton = 1
dest-addr-npi = 1
enquire-link-interval = 30
reconnect-delay = 10
