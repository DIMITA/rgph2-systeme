# Démarrage : cp .env.exemple .env  (puis remplacer tous les secrets)  et  docker compose up -d
# Tests :     voir docker-compose.test.yml

x-image-coeur: &image-coeur
  build: .
  image: rgph2-coeur:local

# Réglages communs à tous les services Python du cœur (API, migrations et commandes
# d'administration, tâches périodiques). Chaque service précise sa connexion à la base.
x-env-coeur: &env-coeur
  PEPPER_TELEPHONE: ${PEPPER_TELEPHONE:?à définir dans .env}
  CLES_API: ${CLES_API:?à définir dans .env}
  CLE_API_CENTRE_ECOUTE: ${CLE_API_CENTRE_ECOUTE:?à définir dans .env}
  CLE_MINISTERE: ${CLE_MINISTERE:?à définir dans .env}
  ENVIRONNEMENT: ${ENVIRONNEMENT:-developpement}
  NUMERO_VERT: ${NUMERO_VERT:-}
  CONSERVATION_TEXTE_QUESTIONS: ${CONSERVATION_TEXTE_QUESTIONS:-tout}
  # Tableau de bord : vérifie les comptes auprès de Directus.
  DIRECTUS_URL: http://directus:8055
  SECRET_SESSION: ${SECRET_SESSION:?à définir dans .env}
  SESSION_HTTPS_SEULEMENT: ${SESSION_HTTPS_SEULEMENT:-false}
  FUSEAU_HORAIRE: ${FUSEAU_HORAIRE:-Africa/Kinshasa}
  # Centre d'appels
  CLE_CHIFFREMENT: ${CLE_CHIFFREMENT:?à définir dans .env}
  SECRET_POSTES: ${SECRET_POSTES:?à définir dans .env}
  NB_POSTES: ${NB_POSTES:-6}
  SVI_TOUCHES_LANGUES: ${SVI_TOUCHES_LANGUES:-fr:1,ln:2,sw:3,kg:4,lua:5}
  DOSSIER_ENREGISTREMENTS: /donnees/enregistrements
  CONSERVATION_ENREGISTREMENTS_JOURS: ${CONSERVATION_ENREGISTREMENTS_JOURS:-90}
  CONSERVATION_RAPPELS_JOURS: ${CONSERVATION_RAPPELS_JOURS:-7}
  # Adresse WebSocket d'Asterisk vue du navigateur des agents (wss://… en production).
  ASTERISK_WS_URL: ${ASTERISK_WS_URL:-ws://localhost:8088/ws}
  SIP_DOMAINE: ${SIP_DOMAINE:-rgph2.local}
  # USSD et SMS
  USSD_CODE: ${USSD_CODE:-}
  SMS_PASSERELLE: kannel
  KANNEL_URL: http://sms:13013/cgi-bin/sendsms
  KANNEL_MDP: ${KANNEL_MDP:?à définir dans .env}
  SMS_EXPEDITEUR: ${SMS_EXPEDITEUR:-RGPH2}
  SMS_REPONSES_PAR_JOUR: ${SMS_REPONSES_PAR_JOUR:-10}
  SMS_SEGMENTS_MAX: ${SMS_SEGMENTS_MAX:-3}
  BADGES_VERIFICATIONS_PAR_HEURE: ${BADGES_VERIFICATIONS_PAR_HEURE:-10}
  SIMULATEUR_MOBILE: ${SIMULATEUR_MOBILE:-false}
  # WhatsApp (API officielle de Meta). « simulation » tant que le compte n'est pas ouvert.
  WHATSAPP_PASSERELLE: ${WHATSAPP_PASSERELLE:-simulation}
  WHATSAPP_NUMERO_ID: ${WHATSAPP_NUMERO_ID:-}
  WHATSAPP_JETON: ${WHATSAPP_JETON:-}
  WHATSAPP_SECRET_APP: ${WHATSAPP_SECRET_APP:-}
  WHATSAPP_JETON_VERIFICATION: ${WHATSAPP_JETON_VERIFICATION:-}

x-url-api: &url-api postgresql+psycopg://rgph_api:${RGPH_API_MDP}@postgres:5432/rgph

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rgph
      POSTGRES_USER: rgph_admin
      POSTGRES_PASSWORD: ${POSTGRES_MDP_ADMIN:?à définir dans .env}
      RGPH_API_MDP: ${RGPH_API_MDP:?à définir dans .env}
      RGPH_DIRECTUS_MDP: ${RGPH_DIRECTUS_MDP:?à définir dans .env}
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgph_admin -d rgph"]
      interval: 5s
      retries: 20

  # Applique les migrations puis s'arrête. Sert aussi aux commandes d'administration
  # qui ont besoin du rôle propriétaire (import des territoires, exemples, purge).
  migrations:
    <<: *image-coeur
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *env-coeur
      DATABASE_URL: postgresql+psycopg://rgph_admin:${POSTGRES_MDP_ADMIN}@postgres:5432/rgph
    volumes:
      - enregistrements:/donnees/enregistrements
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *image-coeur
    restart: unless-stopped
    environment:
      <<: *env-coeur
      DATABASE_URL: *url-api
      # Adresse du proxy HTTPS : sans elle, tous les citoyens partagent la même limite de débit.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - enregistrements:/donnees/enregistrements
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Tâches périodiques, toutes les heures (voir src/coeur/taches.py) : conservation
  # (numéros de rappel, enregistrements), rappels de passage WhatsApp, abonnements expirés.
  taches:
    <<: *image-coeur
    restart: unless-stopped
    command: ["python", "-m", "coeur.taches", "--boucle", "3600"]
    environment:
      <<: *env-coeur
      DATABASE_URL: *url-api
    volumes:
      - enregistrements:/donnees/enregistrements
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Serveur téléphonique : numéro vert, serveur vocal, file d'attente, enregistrements.
  asterisk:
    build: ./asterisk
    image: rgph2-asterisk:local
    # Nom d'hôte fixe et valide : il apparaît dans les messages SIP envoyés aux navigateurs.
    hostname: telephonie
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      CLE_API_CENTRE_ECOUTE: ${CLE_API_CENTRE_ECOUTE:?à définir dans .env}
      SECRET_POSTES: ${SECRET_POSTES:?à définir dans .env}
      NB_POSTES: ${NB_POSTES:-6}
      SIP_DOMAINE: ${SIP_DOMAINE:-rgph2.local}
      SVI_TOUCHES_LANGUES: ${SVI_TOUCHES_LANGUES:-fr:1,ln:2,sw:3,kg:4,lua:5}
      SVI_SYNTHESE_PROVISOIRE: ${SVI_SYNTHESE_PROVISOIRE:-false}
      SVI_SYNCHRO_SECONDES: ${SVI_SYNCHRO_SECONDES:-300}
      RAPPEL_APRES_SECONDES: ${RAPPEL_APRES_SECONDES:-180}
      TELEPHONIE_SIMULATION: ${TELEPHONIE_SIMULATION:-false}
      SIMULATEUR_MDP: ${SIMULATEUR_MDP:-}
      OPERATEUR_SIP_HOTE: ${OPERATEUR_SIP_HOTE:-}
      OPERATEUR_SIP_PORT: ${OPERATEUR_SIP_PORT:-5060}
      OPERATEUR_SIP_UTILISATEUR: ${OPERATEUR_SIP_UTILISATEUR:-}
      OPERATEUR_SIP_MDP: ${OPERATEUR_SIP_MDP:-}
      OPERATEUR_SIP_ENREGISTREMENT: ${OPERATEUR_SIP_ENREGISTREMENT:-false}
      SIP_ADRESSE_EXTERNE: ${SIP_ADRESSE_EXTERNE:-}
      STUN_SERVEUR: ${STUN_SERVEUR:-}
      TZ: ${FUSEAU_HORAIRE:-Africa/Kinshasa}
    volumes:
      - enregistrements:/var/spool/asterisk/enregistrements
    ports:
      - "5060:5060/udp"
      - "10000-10050:10000-10050/udp"
      - "8088:8088"
    depends_on:
      api:
        condition: service_started

  # Passerelle SMS (Kannel) : reçoit les SMS de l'opérateur (SMPP), les transmet au cœur
  # et envoie les réponses. Son port d'envoi (13013) n'est pas publié hors de Docker.
  sms:
    build: ./sms
    image: rgph2-sms:local
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      CLES_API: ${CLES_API:?à définir dans .env}
      KANNEL_MDP: ${KANNEL_MDP:?à définir dans .env}
      SMS_SIMULATION: ${SMS_SIMULATION:-false}
      OPERATEUR_SMPP_HOTE: ${OPERATEUR_SMPP_HOTE:-}
      OPERATEUR_SMPP_PORT: ${OPERATEUR_SMPP_PORT:-2775}
      OPERATEUR_SMPP_UTILISATEUR: ${OPERATEUR_SMPP_UTILISATEUR:-}
      OPERATEUR_SMPP_MDP: ${OPERATEUR_SMPP_MDP:-}
      OPERATEUR_SMPP_SYSTEM_TYPE: ${OPERATEUR_SMPP_SYSTEM_TYPE:-}
    volumes:
      - file_sms:/var/spool/kannel
    depends_on:
      api:
        condition: service_started

  directus:
    image: directus/directus:11.5.1
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY:?à définir dans .env}
      SECRET: ${DIRECTUS_SECRET:?à définir dans .env}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: rgph
      DB_USER: rgph_directus
      DB_PASSWORD: ${RGPH_DIRECTUS_MDP}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?à définir dans .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_MDP:?à définir dans .env}
      PUBLIC_URL: ${DIRECTUS_URL_PUBLIQUE:-http://localhost:8055}
      TELEMETRY: "false"
    volumes:
      - fichiers_directus:/directus/uploads
    ports:
      - "8055:8055"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 5s
      retries: 40
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Configure Directus (affichage des collections, rôles). Idempotent : peut être relancé.
  directus-config:
    <<: *image-coeur
    command: ["python", "outils/configurer_directus.py"]
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      DIRECTUS_ADMIN_MDP: ${DIRECTUS_ADMIN_MDP}
      # Liste des territoires proposée dans le calendrier de passage.
      API_URL: http://api:8000
    depends_on:
      directus:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  donnees_postgres:
  fichiers_directus:
  # Conversations enregistrées : écrites par Asterisk, purgées par le cœur.
  enregistrements:
  # SMS en attente d'envoi (file de Kannel).
  file_sms:
